<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>InvestTrack</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <style>
        :root {
            --bg: #0f172a;
            --bg2: #1e293b;
            --bg3: #334155;
            --text: #f1f5f9;
            --text2: #94a3b8;
            --border: #334155;
            --green: #10b981;
            --red: #ef4444;
            --blue: #3b82f6;
            --purple: #8b5cf6;
            --accent: linear-gradient(135deg, #3b82f6, #8b5cf6);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { font-family: -apple-system, 'Inter', sans-serif; background: var(--bg); color: var(--text); min-height: 100dvh; }

        /* HEADER */
        .header {
            background: var(--bg2);
            padding: 14px 16px 10px;
            border-bottom: 1px solid var(--border);
            position: sticky; top: 0; z-index: 50;
            display: flex; align-items: center; justify-content: space-between;
        }
        .header-title { font-size: 1.1rem; font-weight: 700; background: var(--accent); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .header-actions { display: flex; gap: 8px; }
        .icon-btn {
            background: var(--bg3); border: none; color: var(--text2);
            width: 38px; height: 38px; border-radius: 10px;
            font-size: 1rem; cursor: pointer; display: flex; align-items: center; justify-content: center;
            transition: background 0.2s;
        }
        .icon-btn:active { background: var(--blue); color: white; }

        /* HERO KPIs */
        .hero {
            background: var(--bg2);
            padding: 18px 16px 14px;
            border-bottom: 1px solid var(--border);
        }
        .hero-label { font-size: 0.7rem; color: var(--text2); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 4px; }
        .hero-value {
            font-size: 2.4rem; font-weight: 800; letter-spacing: -1px;
            background: var(--accent); -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }
        .hero-badge {
            display: inline-flex; align-items: center; gap: 4px;
            background: rgba(16, 185, 129, 0.15); color: var(--green);
            border: 1px solid rgba(16, 185, 129, 0.3);
            border-radius: 20px; padding: 3px 10px; font-size: 0.8rem; font-weight: 700;
            margin-top: 6px;
        }
        .hero-badge.neg { background: rgba(239, 68, 68, 0.15); color: var(--red); border-color: rgba(239, 68, 68, 0.3); }
        .kpi-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 14px; }
        .kpi {
            background: var(--bg3); border-radius: 10px; padding: 10px 12px;
        }
        .kpi-l { font-size: 0.68rem; color: var(--text2); margin-bottom: 3px; }
        .kpi-v { font-size: 1rem; font-weight: 700; }

        /* CONTENT */
        .content { padding: 12px; display: flex; flex-direction: column; gap: 12px; }

        /* CARD */
        .card {
            background: var(--bg2); border-radius: 14px; border: 1px solid var(--border);
            overflow: hidden;
        }
        .card-header {
            padding: 12px 14px 8px; font-size: 0.8rem; font-weight: 700;
            color: var(--text2); text-transform: uppercase; letter-spacing: 0.5px;
            border-bottom: 1px solid var(--border);
        }
        .card-body { padding: 12px 14px; }

        /* CHART */
        .chart-wrap { height: 200px; position: relative; padding: 8px 4px 4px; }

        /* ROI LIST */
        .roi-item {
            display: flex; align-items: center; gap: 8px;
            padding: 9px 0; border-bottom: 1px solid var(--border);
        }
        .roi-item:last-child { border-bottom: none; }
        .roi-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
        .roi-name { font-size: 0.78rem; flex: 1; color: var(--text); }
        .roi-bar-wrap { width: 60px; height: 5px; background: var(--bg3); border-radius: 3px; overflow: hidden; }
        .roi-bar { height: 100%; border-radius: 3px; transition: width 0.8s ease; }
        .roi-val { font-size: 0.8rem; font-weight: 700; min-width: 52px; text-align: right; }

        /* TABS */
        .tabs { display: flex; background: var(--bg3); border-radius: 10px; padding: 3px; margin: 0 14px 10px; }
        .tab {
            flex: 1; text-align: center; padding: 6px 4px; border-radius: 7px;
            font-size: 0.72rem; font-weight: 600; color: var(--text2); cursor: pointer;
            transition: all 0.2s;
        }
        .tab.active { background: var(--blue); color: white; }

        /* IMPORT MODAL */
        .overlay {
            display: none; position: fixed; inset: 0;
            background: rgba(0,0,0,0.7); z-index: 100;
            align-items: flex-end; justify-content: center;
        }
        .overlay.show { display: flex; }
        .sheet {
            background: var(--bg2); border-radius: 20px 20px 0 0;
            padding: 20px 20px 36px; width: 100%; max-width: 480px;
            border-top: 1px solid var(--border);
        }
        .sheet h3 { font-size: 1rem; font-weight: 700; margin-bottom: 16px; }
        .sheet-btn {
            width: 100%; padding: 14px; border-radius: 12px; border: none;
            font-size: 0.9rem; font-weight: 700; cursor: pointer; margin-bottom: 10px;
            display: flex; align-items: center; justify-content: center; gap: 8px;
        }
        .sheet-btn-primary { background: var(--blue); color: white; }
        .sheet-btn-secondary { background: var(--bg3); color: var(--text); }
        .sheet-btn:active { opacity: 0.8; }

        /* TOAST */
        .toast {
            position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%);
            background: var(--bg2); border: 1px solid var(--border);
            color: var(--text); padding: 10px 20px; border-radius: 20px;
            font-size: 0.85rem; font-weight: 600; z-index: 200;
            opacity: 0; transition: opacity 0.3s; pointer-events: none;
        }
        .toast.show { opacity: 1; }

        /* EMPTY */
        .empty { text-align: center; padding: 30px; color: var(--text2); font-size: 0.85rem; line-height: 1.6; }

        /* SECTION YEAR BADGE */
        .year-badge {
            display: inline-flex; align-items: center;
            background: var(--bg3); border-radius: 8px; padding: 4px 10px;
            font-size: 0.72rem; font-weight: 700; color: var(--text2);
        }
    </style>
</head>
<body>

<header class="header">
    <div class="header-title">📊 InvestTrack</div>
    <div class="header-actions">
        <button class="icon-btn" onclick="openSheet()" title="Import/Export">💾</button>
    </div>
</header>

<!-- HERO -->
<div class="hero" id="hero">
    <div class="hero-label">Valeur totale du portefeuille</div>
    <div class="hero-value" id="heroValue">— €</div>
    <div id="heroBadge" class="hero-badge">— %</div>
    <div class="kpi-row">
        <div class="kpi">
            <div class="kpi-l">💼 Investi</div>
            <div class="kpi-v" id="kpiInvested">— €</div>
        </div>
        <div class="kpi">
            <div class="kpi-l">💵 Plus-value</div>
            <div class="kpi-v" id="kpiGain">— €</div>
        </div>
    </div>
</div>

<!-- CONTENT -->
<div class="content">
    <!-- Graphe évolution -->
    <div class="card">
        <div class="card-header">📈 Évolution du patrimoine</div>
        <div class="chart-wrap">
            <canvas id="totalChart"></canvas>
        </div>
    </div>

    <!-- ROI par actif avec onglets années -->
    <div class="card">
        <div class="card-header" style="display:flex; align-items:center; justify-content:space-between;">
            <span>🎯 Performance par actif</span>
        </div>
        <div class="tabs" id="yearTabs"></div>
        <div class="card-body" style="padding-top:0;">
            <div id="roiList"></div>
        </div>
    </div>
</div>

<!-- IMPORT/EXPORT SHEET -->
<div class="overlay" id="sheet" onclick="closeSheetOutside(event)">
    <div class="sheet">
        <h3>💾 Données</h3>
        <button class="sheet-btn sheet-btn-primary" onclick="importData()">
            📂 Importer une sauvegarde JSON
        </button>
        <button class="sheet-btn sheet-btn-secondary" onclick="exportData()">
            ⬆️ Exporter vers JSON
        </button>
        <button class="sheet-btn sheet-btn-secondary" onclick="closeSheet()">
            Annuler
        </button>
    </div>
</div>

<div class="toast" id="toast"></div>

        ]
    }
};

let withdrawals = {};
let totalChart = null;
let activeYear = null;

// ============================================
// UTILS
// ============================================
function fmt(n) {
    if (n === undefined || n === null || isNaN(n)) return '—';
    return new Intl.NumberFormat('fr-FR', { maximumFractionDigits: 0 }).format(n) + ' €';
}

function fmtPct(n) {
    if (n === undefined || n === null || isNaN(n)) return '—';
    return (n >= 0 ? '+' : '') + n.toFixed(1) + '%';
}

function getWithdrawal(year, assetName, month) {
    return withdrawals[year]?.[assetName]?.[month] || 0;
}

// ============================================
// LOAD / SAVE
// ============================================
function loadData() {
    const saved = localStorage.getItem('portfolioData');
    if (saved) {
        try {
            const parsed = JSON.parse(saved);
            Object.keys(parsed).forEach(year => {
                if (portfolioData[year]) {
                    parsed[year].assets.forEach((a, i) => {
                        if (portfolioData[year].assets[i]) {
                            portfolioData[year].assets[i].values = a.values;
                        }
                    });
                } else {
                    portfolioData[year] = parsed[year];
                }
            });
        } catch(e) {}
    }
    const savedW = localStorage.getItem('withdrawals');
    if (savedW) try { withdrawals = JSON.parse(savedW); } catch(e) {}
}

// ============================================
// CALCULS
// ============================================
function getLatestMonthData() {
    // Cherche le dernier mois renseigné toutes années confondues
    const years = Object.keys(portfolioData).sort().reverse();
    for (const year of years) {
        const data = portfolioData[year];
        for (let i = data.months.length - 1; i >= 0; i--) {
            const month = data.months[i];
            const hasData = data.assets.some(a => a.values[month] > 0);
            if (hasData) return { year, month, data };
        }
    }
    return null;
}

function getChartData() {
    const labels = [], values = [];
    Object.keys(portfolioData).sort().forEach(year => {
        const data = portfolioData[year];
        data.months.forEach(month => {
            const total = data.assets.reduce((s, a) => s + (a.values[month] || 0), 0);
            if (total > 0) {
                labels.push(month.substring(0, 3) + " '" + year.substring(2));
                values.push(total);
            }
        });
    });
    return { labels, values };
}

function getYearsWithData() {
    return Object.keys(portfolioData).sort().filter(year => {
        const data = portfolioData[year];
        return data.months.some(m => data.assets.some(a => a.values[m] > 0));
    });
}

function getRoiForYear(year) {
    const data = portfolioData[year];
    let lastMonth = null;
    for (let i = data.months.length - 1; i >= 0; i--) {
        if (data.assets.some(a => a.values[data.months[i]] > 0)) {
            lastMonth = data.months[i]; break;
        }
    }
    if (!lastMonth) return [];

    return data.assets.map(asset => {
        const val = asset.values[lastMonth] || 0;
        const w = getWithdrawal(year, asset.name, lastMonth);
        const adjusted = val + w;
        const roi = asset.investissement > 0 ? ((adjusted - asset.investissement) / asset.investissement) * 100 : 0;
        return { name: asset.name, color: asset.color, roi, val, hasData: val > 0 || w > 0 };
    }).filter(a => a.hasData).sort((a, b) => b.roi - a.roi);
}

// ============================================
// RENDER
// ============================================
function renderHero() {
    const latest = getLatestMonthData();
    if (!latest) {
        document.getElementById('heroValue').textContent = '— €';
        document.getElementById('kpiInvested').textContent = '— €';
        document.getElementById('kpiGain').textContent = '— €';
        return;
    }

    const { year, month, data } = latest;
    const totalVal = data.assets.reduce((s, a) => s + (a.values[month] || 0), 0);

    // Investissement depuis l'année la plus récente
    const latestYear = Object.keys(portfolioData).sort().reverse()[0];
    const totalInvested = portfolioData[latestYear].assets.reduce((s, a) => s + a.investissement, 0);
    const gain = totalVal - totalInvested;
    const pct = totalInvested > 0 ? (gain / totalInvested) * 100 : 0;

    document.getElementById('heroValue').textContent = fmt(totalVal);
    document.getElementById('kpiInvested').textContent = fmt(totalInvested);
    document.getElementById('kpiGain').style.color = gain >= 0 ? 'var(--green)' : 'var(--red)';
    document.getElementById('kpiGain').textContent = (gain >= 0 ? '+' : '') + fmt(gain).replace(' €','') + ' €';

    const badge = document.getElementById('heroBadge');
    badge.textContent = fmtPct(pct) + ' vs initial';
    badge.className = 'hero-badge' + (pct < 0 ? ' neg' : '');
}

function renderChart() {
    const { labels, values } = getChartData();
    const ctx = document.getElementById('totalChart');
    if (totalChart) totalChart.destroy();

    if (values.length === 0) return;

    totalChart = new Chart(ctx, {
        type: 'line',
        data: {
            labels,
            datasets: [{
                data: values,
                borderColor: '#10b981',
                backgroundColor: 'rgba(16,185,129,0.12)',
                borderWidth: 2.5,
                tension: 0.4,
                fill: true,
                pointRadius: values.length < 8 ? 4 : 2,
                pointBackgroundColor: '#10b981',
                pointBorderColor: '#0f172a',
                pointBorderWidth: 2,
                pointHoverRadius: 7
            }]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            interaction: { mode: 'index', intersect: false },
            plugins: {
                legend: { display: false },
                tooltip: {
                    backgroundColor: '#1e293b',
                    titleColor: '#f1f5f9',
                    bodyColor: '#94a3b8',
                    borderColor: '#334155',
                    borderWidth: 1,
                    padding: 10,
                    displayColors: false,
                    callbacks: {
                        label: ctx => '💰 ' + fmt(ctx.parsed.y),
                        afterLabel: ctx => {
                            const invested = portfolioData[Object.keys(portfolioData).sort().reverse()[0]].assets.reduce((s,a) => s + a.investissement, 0);
                            const roi = invested > 0 ? ((ctx.parsed.y - invested) / invested * 100) : 0;
                            return '🎯 ROI: ' + fmtPct(roi);
                        }
                    }
                }
            },
            scales: {
                y: {
                    ticks: { color: '#64748b', font: { size: 10 }, callback: v => (v/1000).toFixed(0) + 'k€' },
                    grid: { color: '#1e293b' }
                },
                x: {
                    ticks: { color: '#64748b', font: { size: 9 }, maxTicksLimit: 6 },
                    grid: { display: false }
                }
            }
        }
    });
}

function renderTabs() {
    const years = getYearsWithData();
    const tabs = document.getElementById('yearTabs');
    tabs.innerHTML = '';

    if (years.length === 0) return;
    if (!activeYear || !years.includes(activeYear)) activeYear = years[years.length - 1];

    years.forEach(y => {
        const t = document.createElement('div');
        t.className = 'tab' + (y === activeYear ? ' active' : '');
        t.textContent = y;
        t.onclick = () => { activeYear = y; renderTabs(); renderRoi(); };
        tabs.appendChild(t);
    });
}

function renderRoi() {
    const container = document.getElementById('roiList');
    const years = getYearsWithData();

    if (years.length === 0 || !activeYear) {
        container.innerHTML = '<div class="empty">📭 Aucune donnée<br>Importez votre sauvegarde JSON</div>';
        return;
    }

    const items = getRoiForYear(activeYear);
    if (items.length === 0) {
        container.innerHTML = '<div class="empty">Pas de données pour ' + activeYear + '</div>';
        return;
    }

    const maxAbs = Math.max(...items.map(i => Math.abs(i.roi)), 1);
    container.innerHTML = items.map(item => {
        const barW = Math.min((Math.abs(item.roi) / maxAbs) * 100, 100);
        const col = item.roi >= 0 ? 'var(--green)' : 'var(--red)';
        return `
        <div class="roi-item">
            <div class="roi-dot" style="background:${item.color}"></div>
            <div class="roi-name">${item.name}</div>
            <div class="roi-bar-wrap"><div class="roi-bar" style="width:${barW}%;background:${col}"></div></div>
            <div class="roi-val" style="color:${col}">${fmtPct(item.roi)}</div>
        </div>`;
    }).join('');
}

function renderAll() {
    renderHero();
    renderChart();
    renderTabs();
    renderRoi();
}

// ============================================
// IMPORT / EXPORT
// ============================================
function openSheet() { document.getElementById('sheet').classList.add('show'); }
function closeSheet() { document.getElementById('sheet').classList.remove('show'); }
function closeSheetOutside(e) { if (e.target === document.getElementById('sheet')) closeSheet(); }

function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2500);
}

function importData() {
    closeSheet();
    const input = document.createElement('input');
    input.type = 'file'; input.accept = '.json';
    input.onchange = e => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = ev => {
            try {
                const imported = JSON.parse(ev.target.result);
                if (!imported.portfolioData) throw new Error('Format invalide');

                // Remplacer portfolioData
                Object.keys(portfolioData).forEach(y => delete portfolioData[y]);
                Object.assign(portfolioData, imported.portfolioData);

                if (imported.withdrawals) withdrawals = imported.withdrawals;

                localStorage.setItem('portfolioData', JSON.stringify(portfolioData));
                localStorage.setItem('withdrawals', JSON.stringify(withdrawals));

                activeYear = null;
                renderAll();
                showToast('✅ Import réussi !');
            } catch(err) {
                showToast('❌ Fichier invalide');
            }
        };
        reader.readAsText(file);
    };
    input.click();
}

function exportData() {
    closeSheet();
    const data = JSON.stringify({ portfolioData, withdrawals, version: '1.2', exportDate: new Date().toISOString() }, null, 2);
    const blob = new Blob([data], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'InvestTrack_' + new Date().toISOString().split('T')[0] + '.json';
    a.click();
    URL.revokeObjectURL(url);
    showToast('📤 Export téléchargé');
}

// ============================================
// INIT
// ============================================
loadData();
renderAll();
</script>
